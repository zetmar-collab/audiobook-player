name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: Testy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Biblioteki systemowe Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libpulse0 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - name: Analiza statyczna
        run: python -m pyflakes src tests
      # Runnery nie mają karty dźwiękowej — testy z markerem `audio` są pomijane,
      # pełny zestaw (143 testy) działa lokalnie.
      - name: Testy
        run: python -m pytest -q

  build-windows:
    name: Budowanie wydania (Windows)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Środowisko .venvq (tak jak lokalnie)
        shell: pwsh
        run: |
          python -m venv .venvq
          .\.venvq\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Sprawdź zgodność tagu z wersją w src/appinfo.py
        shell: pwsh
        run: |
          $v = (.\.venvq\Scripts\python.exe -c "import sys; sys.path.insert(0,'src'); import appinfo; print(appinfo.APP_VERSION)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != wersja $v z src/appinfo.py" }
      - name: Exe i wersja przenośna
        shell: pwsh
        run: .\build_exe.ps1
      - name: Smoke test zbudowanego exe
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "abp"
          $p = Start-Process dist\AudiobookPlayer.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test exe: kod $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: AudiobookPlayer-windows
          path: |
            dist/AudiobookPlayer.exe
            dist/AudiobookPlayer-portable-*.zip
